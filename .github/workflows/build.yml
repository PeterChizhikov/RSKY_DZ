name: Сборка программы

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Lab2_Guidance-Windows
            icon: --icon rocket.ico
          - os: macos-latest
            name: Lab2_Guidance-macOS
            icon: --icon rocket.ico
          - os: ubuntu-22.04
            name: Lab2_Guidance-Linux
            icon: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системные библиотеки Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libegl1

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Сборка
        run: pyinstaller --noconfirm --onefile --windowed --name Lab2_Guidance ${{ matrix.icon }} main.py

      - name: Упаковка (macOS)
        if: runner.os == 'macOS'
        run: cd dist && rm -f Lab2_Guidance && zip -r ../${{ matrix.name }}.zip Lab2_Guidance.app

      - name: Упаковка (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Lab2_Guidance.exe -DestinationPath ${{ matrix.name }}.zip

      - name: Упаковка (Linux)
        if: runner.os == 'Linux'
        run: cd dist && chmod +x Lab2_Guidance && tar -czf ../${{ matrix.name }}.tar.gz Lab2_Guidance

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.tar.gz
          if-no-files-found: error
